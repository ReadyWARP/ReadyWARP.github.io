<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyWarp | Официальная сборка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a14;
            --panel-bg: rgba(10, 25, 50, 0.6);
            --accent-core: #0088cc;
            --accent-glow: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #88a0b0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 136, 204, 0.2) 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(0, 210, 255, 0.15) 0%, transparent 35%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер */
        .main-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: appAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes appAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Скругленное квадратное лого */
        .logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 30px;
            border-radius: 28px; /* Стиль iOS squircle */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
            background: #000;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-weight: 800;
            font-size: 3em;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #ffffff 0%, #a0dfff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
            margin-bottom: 45px;
            line-height: 1.5;
        }

        /* Анимированное подчеркивание */
        .magic-line {
            position: relative;
            color: var(--accent-glow);
            font-weight: 600;
            display: inline-block;
        }

        .magic-line::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background: var(--accent-glow);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .ready .magic-line::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Кнопка */
        .btn-dl {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(145deg, #0088cc 0%, #006699 100%);
            color: white;
            text-decoration: none;
            padding: 20px 45px;
            border-radius: 20px;
            font-size: 1.25em;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
        }

        .btn-dl:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.5);
            background: linear-gradient(145deg, #00aaff 0%, #0088cc 100%);
        }

        /* Только версия внизу */
        .footer-info {
            margin-top: 30px;
            font-size: 0.85em;
            color: rgba(136, 160, 176, 0.4);
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body class="ready">

    <div class="main-card">
        <div class="logo-wrapper">
            <img src="logo.png" alt="ReadyWarp" class="logo-img">
        </div>
        
        <h1>ReadyWarp</h1>
        
        <p class="subtitle">
            Премиальный клиент Telegram с <br>
            WebSocket Proxy, который <br>
            <span class="magic-line">реально помогает</span>.
        </p>

        <a href="tg.apk" class="btn-dl">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            Загрузить APK
        </a>
        
        <div class="footer-info">
            VERSION 1.0.5-WS PRO
        </div>
    </div>

    <script>
        // Добавляем класс с задержкой, чтобы анимация подчеркивания была заметна
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.body.classList.add('ready');
            }, 300);
        });
    </script>
</body>
</html>
